  <!-- Выбор языка до показа страницы (бывший lang-early.js). Код встроен, чтобы не ждать отдельный файл;
       в _headers он разрешён по хэшу sha256 - после любой правки кода хэш нужно пересчитать (тесты это поймают). -->
  <script>(function () {
  "use strict";
  try {
    var html = document.documentElement;
    var main = html.getAttribute("lang");
    var langs = (html.getAttribute("data-langs") || main).split(",");
    var pick = null;
    var fromUrl = new URLSearchParams(window.location.search).get("lang");
    if (fromUrl && langs.indexOf(fromUrl) !== -1) pick = fromUrl;
    if (!pick) {
      var saved = null;
      try { saved = window.localStorage.getItem("qpage-lang"); } catch (e) { /* хранилище недоступно */ }
      if (saved && langs.indexOf(saved) !== -1) pick = saved;
    }
    if (!pick) {
      var nav = navigator.languages || [navigator.language || ""];
      for (var i = 0; i < nav.length && !pick; i++) {
        var code = String(nav[i]).slice(0, 2).toLowerCase();
        if (code === "iw") code = "he";
        if (langs.indexOf(code) !== -1) pick = code;
      }
    }
    // Прячем, только если меняется направление письма (иврит ↔ русский/английский): тогда
    // отражается вся страница. Русский ↔ английский - просто замена текста, страницу не прячем,
    // иначе главный текст появляется позже (Google считает это медленной загрузкой, LCP).
    var rtl = function (l) { return l === "he" || l === "ar"; };
    if (pick && pick !== main && rtl(pick) !== rtl(main)) {
      html.classList.add("lang-wait");
      // Если скрипт сайта почему-то не сработал - всё равно показать страницу.
      setTimeout(function () { html.classList.remove("lang-wait"); }, 3000);
    }
  } catch (e) { /* старый браузер - страница просто откроется на основном языке */ }
})();</script>
</head>

  <main id="main" tabindex="-1">
    <noscript><p class="container noscript" data-i18n="ui.noscript">Для переключения языка и работы формы включите JavaScript.</p></noscript>

    <!-- Блоки 1-2: одинаковые во всех версиях. Сверху - цветная заливка: фото владельца слева (если есть),
         по центру три строки - вид деятельности, название, преимущества. Ниже - «Где работаем» и кнопки,
         под ними главное предложение, ещё ниже - главное фото крупно. -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero-banner">
        <div class="container">
          <!-- Вид деятельности - в заголовке вместе с названием: так поисковик видит, чем занимается бизнес -->
          <h1 id="hero-title"><span class="hero-kind" data-i18n="hero.kind"></span> <span class="hero-name" data-i18n="hero.name"></span></h1>
          <ul class="hero-facts" id="hero-facts"></ul>
          <!-- QR-код сайта справа (симметрично фото владельца): владелец показывает его клиенту прямо с экрана.
               По нажатию - крупно по центру экрана. Рисует app.js (renderQr). -->
          <button class="hero-qr" id="hero-qr" type="button" data-block="qr" data-i18n-attr="aria-label:qr.title"><span class="hero-qr-tile" id="hero-qr-code"></span></button>
        </div>
      </div>
      <div class="container hero-body">
        <!-- На телефоне преимущества стоят здесь, под цветной заливкой: в заливке только фото и название -->
        <ul class="hero-facts hero-facts-below" id="hero-facts-below"></ul>
        <div class="hero-more">
          <!-- Районы выезда - сразу на первом экране, чтобы клиент видел, приедут ли к нему -->
          <p class="hero-areas" id="hero-areas" hidden>
            <span><span data-i18n="contacts.areas"></span> <strong id="hero-areas-text"></strong></span>
          </p>
          <div class="hero-actions">
            <a class="btn btn-secondary" href="#form" data-block="form">
              <span data-i18n="ui.writeUs"></span>
            </a>
            <a class="btn btn-primary" data-contact="phone">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg>
              <span data-i18n="ui.call"></span>
            </a>
          </div>
        </div>
        <p class="hero-tagline" data-i18n="hero.tagline"></p>
      </div>
    </section>

        <h2 id="map-title" data-i18n="map.title"></h2>
        <p class="address">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg>
          <span data-i18n="map.address"></span>
        </p>
        <div class="map-links">
          <a class="btn btn-secondary" id="map-google" target="_blank" rel="noopener noreferrer" data-i18n="map.openGoogle"></a>
          <a class="btn btn-secondary" id="map-waze" target="_blank" rel="noopener noreferrer" data-i18n="map.openWaze"></a>
        </div>
        <div class="map-box" id="map-box">
          <div class="map-placeholder" id="map-placeholder">
            <p data-i18n="map.note"></p>
            <button class="btn btn-primary" type="button" id="map-show" data-i18n="map.show"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- Блок 10: форма обратной связи -->
    <section class="section" id="form" data-block="form" aria-labelledby="form-title">
      <div class="container narrow">
        <h2 id="form-title">
          <span data-i18n="form.title"></span>
          <span class="badge" data-form-demo data-i18n="form.demoBadge"></span>
        </h2>
        <p class="demo-box" data-form-demo id="form-demo-text" data-i18n="form.demoText"></p>
        <p data-i18n="form.intro"></p>

        <form id="contact-form" name="contact" method="post" novalidate aria-describedby="form-demo-text">
          <input type="hidden" name="form-name" value="contact">
          <!-- Ловушка для ботов: человек это поле не видит -->
          <p class="hp" aria-hidden="true">
            <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          </p>

          <div class="error-summary" id="error-summary" tabindex="-1" role="alert" hidden></div>

          <div class="field">
            <label for="f-name"><span data-i18n="form.name"></span> <span class="req" aria-hidden="true">*</span><span class="visually-hidden" data-i18n="form.required"></span></label>
            <input id="f-name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="80" aria-describedby="f-name-err">
            <p class="field-error" id="f-name-err"></p>
          </div>

          <div class="field">
            <label for="f-phone"><span data-i18n="form.phone"></span> <span class="req" aria-hidden="true">*</span><span class="visually-hidden" data-i18n="form.required"></span></label>
            <input id="f-phone" name="phone" type="tel" dir="ltr" autocomplete="tel" inputmode="tel" required maxlength="24" aria-describedby="f-phone-hint f-phone-err">
            <p class="field-hint" id="f-phone-hint" data-i18n="form.phoneHint"></p>
            <p class="field-error" id="f-phone-err"></p>
          </div>

          <div class="field">
            <label for="f-email" data-i18n="form.email"></label>
            <input id="f-email" name="email" type="email" dir="ltr" autocomplete="email" maxlength="120" aria-describedby="f-email-hint f-email-err">
            <p class="field-hint" id="f-email-hint" data-i18n="form.emailHint"></p>
            <p class="field-error" id="f-email-err"></p>
          </div>

          <div class="field">
            <label for="f-message"><span data-i18n="form.message"></span> <span class="req" aria-hidden="true">*</span><span class="visually-hidden" data-i18n="form.required"></span></label>
            <textarea id="f-message" name="message" rows="5" required minlength="10" maxlength="2000" aria-describedby="f-message-hint f-message-err"></textarea>
            <p class="field-hint" id="f-message-hint" data-i18n="form.messageHint"></p>
            <p class="field-error" id="f-message-err"></p>
          </div>

          <div class="field field-check">
            <input id="f-consent" name="consent" type="checkbox" required aria-describedby="f-consent-err">
            <label for="f-consent"><span id="f-consent-text"></span> <span class="req" aria-hidden="true">*</span></label>
            <p class="field-error" id="f-consent-err"></p>
          </div>

          <button class="btn btn-primary" type="submit" id="f-submit" data-i18n="form.submit"></button>

          <div class="form-result" id="form-result" role="status" aria-live="polite"></div>
          <div class="form-wa" id="form-wa" hidden>
            <p id="form-wa-also" data-i18n="form.waAlso"></p>
            <a class="btn btn-whatsapp" id="form-wa-link" target="_blank" rel="noopener noreferrer">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-whatsapp"/></svg>
              <span data-i18n="form.waButton"></span>
            </a>
          </div>
        </form>
      </div>
    </section>

    <!-- Блок 11: QR-код -->
    <section class="section section-soft" id="qr" data-block="qr" aria-labelledby="qr-title">
      <div class="container qr-inner">
        <div class="qr-code" id="qr-code" role="img" data-i18n-attr="aria-label:qr.alt"></div>
        <div>
          <h2 id="qr-title" data-i18n="qr.title"></h2>
          <p data-i18n="qr.text"></p>
          <p class="qr-url"><bdi dir="ltr" id="qr-url"></bdi></p>
          <p class="field-hint" id="qr-local-note" data-i18n="qr.localNote" hidden></p>
          <div class="qr-actions">
            <a class="btn btn-secondary" id="qr-download" data-i18n="qr.download"></a>
            <button class="btn btn-secondary" type="button" id="qr-share">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-share"/></svg>
              <span data-i18n="qr.share"></span>
            </button>
          </div>
          <p class="field-hint" id="qr-share-status" role="status"></p>
        </div>
      </div>
    </section>

    <!-- Заявление о доступности -->
    <section class="section" id="accessibility" data-block="accessibility" aria-labelledby="accessibility-title">
      <div class="container narrow">
        <h2 id="accessibility-title" data-i18n="accessibility.title"></h2>
        <p data-i18n="accessibility.summary"></p>
        <details class="privacy-more" id="accessibility-more">
          <summary data-i18n="accessibility.more"></summary>
          <ul class="privacy-list" id="accessibility-list"></ul>
        </details>
      </div>
    </section>

    <!-- Блок 12: конфиденциальность -->
    <section class="section" id="privacy" data-block="privacy" aria-labelledby="privacy-title">
      <div class="container narrow">
        <h2 id="privacy-title" data-i18n="privacy.title"></h2>
        <p data-i18n="privacy.summary"></p>
        <details class="privacy-more" id="privacy-more">
          <summary data-i18n="privacy.more"></summary>
          <ul class="privacy-list" id="privacy-list"></ul>
          <p class="demo-box" data-form-demo data-i18n="privacy.demoNote"></p>
        </details>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p id="footer-rights"></p>
      <p id="footer-legal" hidden><bdi id="footer-legal-text"></bdi></p>
      <p><a href="#privacy" data-block="privacy" data-i18n="privacy.title"></a></p>
      <p><a href="#accessibility" data-block="accessibility" data-i18n="accessibility.title"></a></p>
    </div>
    <!-- Подпись QPage отдельной строкой внизу: со ссылкой на заказ сайта (site.madeBy.url), без ссылки - просто текст -->
    <div class="container footer-made">
      <p class="made-with">
        <a id="made-with" target="_blank" rel="noopener">
          <span id="made-with-text"></span>
          <span class="made-with-order" data-i18n="footer.orderSite"></span>
        </a>
      </p>
    </div>
  </footer>

  <!-- Панель быстрых действий на телефоне -->
  <aside class="mobile-bar" id="mobile-bar" data-block="contacts" data-i18n-attr="aria-label:ui.quickContact">
    <a class="btn btn-primary" data-contact="phone">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg>
      <span data-i18n="ui.call"></span>
    </a>
    <a class="btn btn-whatsapp" data-contact="whatsapp" target="_blank" rel="noopener noreferrer">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-whatsapp"/></svg>
      <span data-i18n="ui.whatsapp"></span>
    </a>
  </aside>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/vendor/qrcode.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
